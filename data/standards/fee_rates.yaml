# 부대비 요율표 — 공사비(부가가치세 제외) 구간별 요율(%). 구간 사이는 직선보간, 최고 구간을 넘으면 마지막 요율을 쓴다.
# LH 추정자료의 자체 요율은 확보하지 못해 정부 예산편성 기준 요율을 쓴다.
source: >-
  기획재정부(2024) 「2025년도 지방자치단체 예산편성 운영기준 및 기금운용계획 수립기준」,
  행정안전부(2024) 「지방재정 투자심사 및 타당성조사 매뉴얼」 —
  인천연구원(2024) 「2025년 인천광역시 지방재정 투자사업 비용산정 가이드라인」 표 5-1, 5-2, 5-10, 5-13 재인용
source_url: https://www.ii.re.kr/storage/report/BB0000042011.pdf
