# 용도지역 및 이용상황별 보상배율
version: "2018.4"
source: >-
  기획재정부 「예비타당성조사 수행 총괄지침」(2018.4),
  KDI 「공기업·준정부기관 사업 예비타당성조사 수행을 위한 일반지침 수정·보완 연구(제2판)」 <표 Ⅴ-41>, <표 Ⅴ-42>
note: 최신 개정판(KDI 2021 공시지가 보상배율 개정 연구 이후) 확보 시 새 파일로 추가해 교체한다.

# 지장물 및 기타 보상비 = 토지보상비 × 비율 (<표 Ⅴ-42>)
obstacle_ratio:
  택지개발: 0.25
  산업단지: 0.25
  관광단지: 0.20
  도로: 0.20
  철도: 0.20

zone_classes: [주거·상업·공업, 녹지·개발제한, 관리, 농림·자연환경보전]
use_classes: [주거용·공업용, 상업용·주상용, 전·답, 임야, 공공·기타]

# 값이 없는 칸은 null (적용 시 해당 시도의 "전체" 배율로 대체)
multipliers:
  서울: {전체: 1.66, zone: [1.59, 1.84, null, null], use: [1.23, 1.52, 1.29, 2.77, 3.66]}
  부산: {전체: 1.90, zone: [1.87, 1.93, null, null], use: [1.86, 1.61, 1.90, 3.00, 3.90]}
  대구: {전체: 2.05, zone: [1.90, 2.18, 2.90, 2.78], use: [1.92, 1.57, 2.05, 3.89, 4.89]}
  인천: {전체: 2.10, zone: [1.66, 1.77, 3.13, 2.36], use: [1.66, 1.11, 2.16, 2.64, 3.89]}
  광주: {전체: 2.13, zone: [1.54, 2.71, 2.57, null], use: [1.54, 1.31, 2.18, 2.80, 3.28]}
  대전: {전체: 1.59, zone: [1.59, 1.83, 2.00, 3.00], use: [1.59, 1.57, 1.60, 2.59, 3.81]}
  울산: {전체: 2.78, zone: [2.09, 3.04, 2.82, 3.00], use: [1.91, 1.88, 2.45, 5.00, 4.44]}
  세종: {전체: 2.87, zone: [2.55, 2.79, 3.33, 2.75], use: [2.34, 2.04, 2.70, 5.11, 4.16]}
  경기: {전체: 1.85, zone: [1.49, 1.92, 2.08, 2.01], use: [1.63, 1.57, 1.77, 2.70, 2.88]}
  강원: {전체: 2.44, zone: [1.89, 2.65, 2.71, 2.68], use: [1.90, 1.64, 2.38, 4.46, 4.62]}
  충북: {전체: 2.35, zone: [1.37, 2.38, 2.88, 2.61], use: [1.74, 1.56, 2.31, 3.07, 5.20]}
  충남: {전체: 2.49, zone: [1.93, 2.54, 2.96, 2.39], use: [2.04, 1.63, 2.33, 3.58, 4.06]}
  전북: {전체: 2.15, zone: [1.82, 2.22, 2.61, 2.09], use: [1.95, 1.69, 2.11, 3.42, 4.25]}
  전남: {전체: 2.50, zone: [2.03, 2.75, 2.62, 2.47], use: [2.17, 1.72, 2.40, 4.50, 5.00]}
  경북: {전체: 2.64, zone: [2.24, 2.52, 2.99, 2.54], use: [2.10, 1.82, 2.52, 4.50, 5.31]}
  경남: {전체: 2.73, zone: [1.96, 3.08, 3.13, 2.62], use: [2.13, 1.80, 2.70, 4.50, 4.17]}
  제주: {전체: 2.17, zone: [1.73, 2.22, 2.60, 2.71], use: [1.69, 1.50, 2.43, 3.10, 4.11]}

# PNU 앞 2자리(시도코드) → 배율표의 시도
sido_codes:
  "11": 서울
  "26": 부산
  "27": 대구
  "28": 인천
  "29": 광주
  "30": 대전
  "31": 울산
  "36": 세종
  "41": 경기
  "42": 강원
  "51": 강원
  "43": 충북
  "44": 충남
  "45": 전북
  "52": 전북
  "46": 전남
  "47": 경북
  "48": 경남
  "50": 제주

# 용도지역 명칭 → 배율표 용도지역 분류. 위에서부터 순서대로 검사해 처음 일치하는 것을 쓴다(부분 문자열 일치).
zone_mapping:
  - {contains: 자연환경보전, class: 농림·자연환경보전}
  - {contains: 농림, class: 농림·자연환경보전}
  - {contains: 관리, class: 관리}
  - {contains: 개발제한, class: 녹지·개발제한}
  - {contains: 녹지, class: 녹지·개발제한}
  - {contains: 주거, class: 주거·상업·공업}
  - {contains: 상업, class: 주거·상업·공업}
  - {contains: 공업, class: 주거·상업·공업}

# 토지특성의 이용상황 → 배율표 이용상황 분류 (contains: 부분 문자열 일치, starts: 앞부분 일치. 위에서부터 검사)
# 어느 규칙에도 맞지 않으면 "공공·기타"
use_mapping:
  - {contains: 주상, class: 상업용·주상용}
  - {contains: 상업, class: 상업용·주상용}
  - {contains: 업무, class: 상업용·주상용}
  - {contains: 단독, class: 주거용·공업용}
  - {contains: 연립, class: 주거용·공업용}
  - {contains: 다세대, class: 주거용·공업용}
  - {contains: 아파트, class: 주거용·공업용}
  - {contains: 주거, class: 주거용·공업용}
  - {contains: 공업, class: 주거용·공업용}
  - {contains: 과수원, class: 전·답}
  - {starts: 전, class: 전·답}
  - {starts: 답, class: 전·답}
  - {contains: 조림, class: 임야}
  - {contains: 자연림, class: 임야}
  - {contains: 임야, class: 임야}
  - {contains: 목장, class: 임야}

# 이용상황 정보가 없을 때 지목으로 대신 분류
jimok_to_use:
  전: 전·답
  답: 전·답
  과수원: 전·답
  임야: 임야
  목장용지: 임야
  대: 주거용·공업용
  공장용지: 주거용·공업용
  창고용지: 주거용·공업용
  주유소용지: 상업용·주상용
# 위에 없는 지목(도로, 하천, 구거, 유지, 잡종지, 묘지 등)은 "공공·기타"
