[project]
name = "newtown"
version = "0.1.0"
description = "신도시 개발사업 타당성 분석 시스템"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "streamlit-folium>=0.23",
    "folium>=0.18",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "altair>=5.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newtown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
